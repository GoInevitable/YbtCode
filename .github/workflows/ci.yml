name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    name: Build (Windows + MSYS2)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-gcc

    - name: Build with g++ (MSYS2)
      shell: bash
      run: |
        # Ensure msys2/mingw64 is in PATH (setup-msys2 takes care of this in the action)
        g++ -v
        g++ -std=c++17 game/dnstool.cpp -o game/dnstool.exe -lws2_32 -liphlpapi

    - name: Smoke test (show help)
      shell: bash
      run: |
        ./game/dnstool.exe -h || true
